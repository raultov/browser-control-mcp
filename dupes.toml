# Duplication thresholds for browser-control-mcp (cargo-dupes 0.2.1).
#
# Copied from bidi-lite on 2026-10-12. The ratchet target is ZERO. The single
# exception is the F1 baseline of the imported code (specs D22), brought back
# to zero in F3.
#
# IMPORTANT: cargo-dupes reads this file ONLY from the analysed directory (no
# parent lookup) and `cargo dupes check` silently passes when none is found.
# The Makefile refuses to run the gate without it.
#
# NOTE: cargo-dupes normalises the AST (identifiers become positional
# placeholders, literal VALUES are erased). Two functions that differ only in
# the string literals they embed collapse into one fingerprint. Fix those by
# extracting a parameterised helper. Only a genuine false positive goes to
# .dupes-ignore.toml, always with a `reason`; never raise the thresholds.

# --- Analysis scope ---
min_lines = 10
min_nodes = 10
similarity_threshold = 0.8

# --- Exclusions ---
# Test code is repetitive by design (Given/When/Then). exclude_tests drops
# #[test] functions and #[cfg(test)] modules. Test-only modules declared
# #[cfg(test)] at their `mod` line cannot be seen as such from inside the
# file, hence the explicit patterns. docs/ holds the gitignored specs and the
# throw-away spike probe crate. Patterns are plain substring matches.
exclude_tests = true
exclude = ["tests/", "/docs/", "integration_tests.rs", "bdd_tests.rs", "backend/mock.rs", "test_support"]

# --- CI thresholds (consumed by `cargo dupes check`) ---
# F1 baseline of the imported code (specs D22), measured 2026-10-12:
# 2 exact groups (9 units, 105 lines), 2 near groups (5 units, 118 lines),
# 2.2 % exact and 2.5 % near of 4,711 lines
# (printed rounded; the limits are 2.3 / 2.6 because the gate compares unrounded). Target 0 / 0 / 0.0 / 0.0, F3.6.
max_exact_duplicates = 2
max_near_duplicates = 2
max_exact_percent = 2.3
max_near_percent = 2.6
