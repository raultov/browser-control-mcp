[package]
name = "browser-control-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["raultov <raultov@protonmail.com>"]
description = "MCP server to control and debug Chrome and Firefox at runtime (work in progress)."
readme = "README.md"
homepage = "https://github.com/raultov/browser-control-mcp"
repository = "https://github.com/raultov/browser-control-mcp"
license = "MIT"
keywords = ["mcp", "browser", "debugging", "devtools", "firefox"]
categories = ["development-tools::debugging", "web-programming", "command-line-utilities"]
exclude = [
    ".gitignore", ".github/*", "docs/*", "tests/*", "wix/*", "Makefile", "dupes.toml",
    "clippy.toml", "AGENTS.md", "package.json", "glama.json", "Dockerfile", "dist-workspace.toml",
]

[lints.rust]
# No-unsafe policy (AGENTS.md). `deny` rather than `forbid`: an audited
# exception would need `#[expect(unsafe_code, reason = "...")]`.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
# Readability gates. Thresholds live in clippy.toml; these two are
# allow-by-default (pedantic/nursery), so they are inert without this.
too_many_lines = "warn"
cognitive_complexity = "warn"

# Ban bare `#[allow]` in favour of `#[expect(..., reason = "...")]`.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# A panic in a server kills the agent's session: a bug the caller cannot handle.
# F1 TEMPORARY RELAXATION (specs 01 §5, D22): the imported code has 38
# unwrap/expect sites. Restored to "warn" in F2.8; never past the F2 gate.
unwrap_used = "allow"
expect_used = "allow"
panic = "warn"

# cdp-browser-lite needed `#[expect]` for these; this crate must pass clean.
struct_excessive_bools = "warn"
fn_params_excessive_bools = "warn"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
cdp-browser-lite = "0.4.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
rust-mcp-sdk = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
url = "2.5.8"

[dev-dependencies]
# In-process DevTools mocks for the unit tests only (specs D31).
cdp-browser-lite = { version = "0.4.1", features = ["test-support"] }
