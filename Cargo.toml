[package]
name = "browser-control-mcp"
version = "0.1.1-beta.1"
edition = "2024"
rust-version = "1.98"
authors = ["raultov <raultov@protonmail.com>"]
description = "MCP server to control and debug Chrome and Firefox at runtime: breakpoints, call frames and stepping over CDP and WebDriver BiDi/RDP, plus navigation, DOM, input, screenshots, console and network capture."
readme = "README.md"
homepage = "https://github.com/raultov/browser-control-mcp"
repository = "https://github.com/raultov/browser-control-mcp"
license = "MIT"
keywords = ["mcp", "browser", "debugging", "devtools", "firefox"]
categories = ["development-tools::debugging", "web-programming", "command-line-utilities"]
exclude = [
    ".gitignore", ".dockerignore", ".github/*", "docs/*", "tests/*", "wix/*", "Makefile", "dupes.toml",
    "clippy.toml", "AGENTS.md", "package.json", "glama.json", "Dockerfile", "dist-workspace.toml",
]

[package.metadata.wix]
# Fresh GUIDs: reusing chrome-debug-mcp's would make this MSI "upgrade" (replace) it.
upgrade-guid = "CC54DD67-004D-42FC-8418-5DCB785929E6"
path-guid = "7723A5F2-1962-4FA1-A182-0E04249DD61C"
license = false
eula = false

# The profile that 'dist' builds with
[profile.dist]
inherits = "release"
lto = "thin"

[lints.rust]
# No-unsafe policy (AGENTS.md). `deny` rather than `forbid`: an audited
# exception would need `#[expect(unsafe_code, reason = "...")]`.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
# Readability gates. Thresholds live in clippy.toml; these two are
# allow-by-default (pedantic/nursery), so they are inert without this.
too_many_lines = "warn"
cognitive_complexity = "warn"

# Ban bare `#[allow]` in favour of `#[expect(..., reason = "...")]`.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# A panic in a server kills the agent's session: a bug the caller cannot handle.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# cdp-browser-lite needed `#[expect]` for these; this crate must pass clean.
struct_excessive_bools = "warn"
fn_params_excessive_bools = "warn"

[dependencies]
async-trait = "0.1.92"
cdp-browser-lite = "0.4.2"
bidi-browser-lite = "0.1.4"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
rust-mcp-sdk = { version = "1.1.0", default-features = false, features = ["server", "macros", "stdio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
url = "2.5.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.21"

[dev-dependencies]
# In-process BiDi/RDP mocks (MockBidi, MockRdp, MockFirefox).
bidi-browser-lite = { version = "0.1.4", features = ["test-support"] }
# In-process DevTools mocks for the unit tests only (specs D31).
cdp-browser-lite = { version = "0.4.2", features = ["test-support"] }
