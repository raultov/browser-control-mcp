<style>header{position:fixed;top:0;left:0;right:0;height:60px;background:#ddd;z-index:5}body{margin:0;padding-top:70px}</style></head><body>
<header>Sticky header</header>
<div id="box" style="height:120px;overflow:auto;border:1px solid #000"><div style="height:900px"></div><button onclick="window.__deep=1">Deep button</button></div>
<div style="height:3000px"></div>
<button onclick="window.__far=1">Far button</button>
<div style="height:1500px"></div><p>End of page</p>
</body></html>
