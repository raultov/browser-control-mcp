<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Dialogs</title></head><body>
<button onclick="alert('Hello alert')">Alert</button>
<button onclick="document.getElementById('out').textContent = confirm('Sure?') ? 'confirmed' : 'cancelled'">Confirm</button>
<button onclick="document.getElementById('out').textContent = 'name=' + prompt('Your name?', 'anon')">Prompt</button>
<button onclick="window.onbeforeunload = e => { e.preventDefault(); e.returnValue = ''; }; document.getElementById('out').textContent='guarded'">Guard</button>
<p id="out"></p></body></html>
